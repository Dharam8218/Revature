<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>jQuery Demo</title>
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <button id="btn">Hide Text</button>
    <button id="btn2">Show</button>
    <button id="btn3">Input</button>

    <script>
        $(document).ready(function () {
            $("#btn").click(function () {
                $("p").css("color", "red");
                $("h2").hide();
                $("#box").hide();

            });
        });

        $(document).ready(function () {
            $("#btn2").click(function () {
                $(".item").show();
            });
        });


        $(document).ready(function () {
            $("#btn3").click(function () {
                $("input [type='text']").val("Hello");
            });
        });
    </script>
    <p>Hello, this is jQuery!!</p>
    <h2>this is h2 text</h2>
    <div id="box" style="width: 100px; height: 100px; border: 1px solid black;">Hello there!</div>
    <div class="item" style="display: none;">
        <ol>City Names
            <li>Noida</li>
            <li>Gurugram</li>
            <li>Delhi</li>
            <li>Ahemdabad</li>
        </ol>
    </div>

    <br>
    <div class="input">
        <input type="text" placeholder="Enter your name">
    </div>

</body>

</html>
